name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: actions/cache@v6
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('elm.json') }}
      - run: yarn install --frozen-lockfile
      - run: yarn test
